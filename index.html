<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" href="/AI-Center_Logo.png" />
    <!-- Font identitas di-self-host di public/fonts (@font-face di src/index.css):
         General Sans (isi) + Cabinet Grotesk (judul); dipreload agar tampil cepat. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/GeneralSans-Regular.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/CabinetGrotesk-Bold.woff2" crossorigin />
    <!-- __PETA_CHUNK: default {} (dev / build tanpa plugin), lalu DIGANTI plugin
         `peta-chunk-rute` saat build — HARUS berada SEBELUM IIFE di bawah supaya
         peta sudah terisi saat IIFE membacanya (bila script peta menyusul setelah
         IIFE, modulepreload tidak pernah jalan dan chunk menunggu dynamic import). -->
    <script>window.__PETA_CHUNK = {};</script>
    <!-- Preload HANYA hero beranda (elemen LCP): URL gambar baru diketahui setelah
         chunk rute dimuat, tanpa ini unduhan terlambat dan skor Lighthouse turun.
         Kondisional per pathname — halaman lain sengaja tidak di-preload agar
         tidak berebut bandwidth (menjaga skor halaman lain).
         __PETA_CHUNK diisi plugin `peta-chunk-rute` saat build (dev tanpa peta). -->
    <script>
      (function () {
        var p = location.pathname;
        var beranda = /(^|\/)beranda\/?$/.test(p) || p === '/';
        if (beranda) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = '/hero-1-800.webp';
          l.setAttribute('imagesrcset', '/hero-1-800.webp 800w, /hero-1-1600.webp 1600w');
          l.setAttribute('imagesizes', '100vw');
          document.head.appendChild(l);
        }
        // modulepreload chunk rute lazy: konten tampil pada render pertama tanpa
        // menunggu rantai dynamic-import berurutan (pengungkit terbesar skor mobile).
        var peta = window.__PETA_CHUNK;
        if (!peta) return;
        for (var k in peta) {
          if (p.indexOf(k) === -1 && !(k === '/beranda' && beranda)) continue;
          var urls = peta[k];
          for (var i = 0; i < urls.length; i++) {
            var m = document.createElement('link');
            m.rel = 'modulepreload';
            m.href = urls[i];
            document.head.appendChild(m);
          }
        }
      })();
    </script>
    <meta
      name="description"
      content="AI Center Universitas Surabaya — riset AI, pelatihan, inference solution, dan publikasi."
    />
    <title>AI Center Universitas Surabaya</title>
    <!-- Catatan performa: JANGAN preload gambar hero di sini — index.html dipakai
         SEMUA rute, preload global menghukum halaman tanpa hero (tentang-kami,
         tim, …). LCP beranda sudah ditangani fetchpriority="high" di HeroCarousel. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
