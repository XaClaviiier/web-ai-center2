# CI: dijalankan pada setiap PR dan push ke main. Tes Playwright (butuh Keycloak) belum termasuk.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: ai_center_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d ai_center_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      rustfs:
        image: rustfs/rustfs:1.0.3
        env:
          RUSTFS_ACCESS_KEY: ai-center-ci
          RUSTFS_SECRET_KEY: ai-center-ci-secret
          RUSTFS_ADDRESS: ":9000"
        ports: ["9000:9000"]
    env:
      # Tanpa variabel ini tes integrasi dilewati diam-diam (testutil), jadi CI hijau palsu.
      TEST_DATABASE_URL: postgres://user:secret@127.0.0.1:5432/ai_center_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      RUSTFS_ENDPOINT: http://127.0.0.1:9000
      RUSTFS_ACCESS_KEY: ai-center-ci
      RUSTFS_SECRET_KEY: ai-center-ci-secret
      RUSTFS_BUCKET: ai-center-images
      TEST_RUSTFS_BUCKET: ai-center-test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Migrasi database tes
        run: go run github.com/pressly/goose/v3/cmd/goose@v3.29.0 -dir migrations postgres "$TEST_DATABASE_URL" up
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -p 1 ./... -count=1 -timeout 15m

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - name: Tes statis web/
        run: node scripts/tests/web.test.cjs
      - name: Tes klien API
        run: bun test scripts/tests/api.test.ts
