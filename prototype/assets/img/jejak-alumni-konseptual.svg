<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustrasi konseptual catatan alumni yang diolah menjadi grafik tren dan ringkasan masukan, bukan data alumni nyata.">
  <title>Ilustrasi konseptual analisis data alumni</title>
  <style>
    text { font-family: "General Sans", "Segoe UI", Arial, sans-serif; fill: #0A2240; }
    .panel { fill: #fff; stroke: #C9D5E0; stroke-width: 2; }
    .baris { stroke: #C9D5E0; stroke-width: 7; stroke-linecap: round; }
    .hubung { fill: none; stroke: #2547F4; stroke-width: 3; stroke-dasharray: 10 7; }
  </style>
  <rect width="960" height="600" fill="#F1F7FC"/>

  <!-- Catatan alumni tanpa identitas atau angka nyata -->
  <rect x="56" y="142" width="292" height="360" rx="20" class="panel"/>
  <path d="M86 180h148" stroke="#0A2240" stroke-width="12" stroke-linecap="round"/>
  <g fill="#D8EBF8" stroke="#8FA3B5" stroke-width="2.5">
    <circle cx="106" cy="252" r="24"/>
    <circle cx="106" cy="344" r="24"/>
    <circle cx="106" cy="436" r="24"/>
  </g>
  <path d="M154 240h156M154 264h112M154 332h156M154 356h96M154 424h156M154 448h126" class="baris"/>

  <!-- Alur konseptual menuju dua bentuk informasi -->
  <path d="M348 322h64V230h76M412 322v106h76" class="hubung"/>
  <circle cx="412" cy="322" r="7" fill="#2547F4"/>

  <!-- Grafik skematis: tanpa skala, persentase, atau hasil pengukuran -->
  <rect x="488" y="142" width="424" height="188" rx="20" class="panel"/>
  <path d="M520 174h128" stroke="#0A2240" stroke-width="10" stroke-linecap="round"/>
  <path d="M524 204v96h346" fill="none" stroke="#8FA3B5" stroke-width="2.5"/>
  <g fill="#D8EBF8" stroke="#8FA3B5" stroke-width="2">
    <rect x="550" y="256" width="40" height="44" rx="5"/>
    <rect x="622" y="232" width="40" height="68" rx="5"/>
    <rect x="694" y="244" width="40" height="56" rx="5"/>
    <rect x="766" y="214" width="40" height="86" rx="5"/>
  </g>
  <path d="m570 238 72-24 72 12 72-30" fill="none" stroke="#2547F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ringkasan masukan dalam bentuk lembar editorial -->
  <rect x="488" y="358" width="424" height="144" rx="20" class="panel"/>
  <path d="M522 392h138" stroke="#0A2240" stroke-width="10" stroke-linecap="round"/>
  <path d="M522 428h352M522 454h296M522 478h214" class="baris"/>
  <g fill="none" stroke="#2547F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M848 378v20M838 388h20M873 399v12M867 405h12"/>
  </g>

  <rect x="28" y="26" width="400" height="56" rx="28" fill="#F3D502"/>
  <text x="228" y="63" font-size="29" font-weight="700" text-anchor="middle">Ilustrasi konseptual</text>
</svg>
