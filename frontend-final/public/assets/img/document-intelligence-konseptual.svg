<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustrasi konseptual tiga dokumen sintetis yang diolah menjadi hasil pemeriksaan.">
  <title>Ilustrasi konseptual pemeriksaan dokumen</title>
  <style>
    text { font-family: "General Sans", "Segoe UI", Arial, sans-serif; fill: #0A2240; }
    .dok { fill: #fff; stroke: #8FA3B5; stroke-width: 2.5; }
    .baris { stroke: #C9D5E0; stroke-width: 7; stroke-linecap: round; }
    .sorot { fill: #D8EBF8; stroke: #2547F4; stroke-width: 3; }
    .hubung { fill: none; stroke: #2547F4; stroke-width: 3; stroke-dasharray: 10 7; }
    .panel { fill: #fff; stroke: #C9D5E0; stroke-width: 2; }
  </style>
  <rect width="960" height="600" fill="#F1F7FC"/>

  <!-- Tiga dokumen dengan tata letak berbeda -->
  <g transform="rotate(-5 200 330)">
    <rect x="56" y="150" width="270" height="350" rx="12" class="dok"/>
    <path d="M84 196 H230 M84 232 H290 M84 268 H290" class="baris"/>
  </g>
  <g transform="rotate(2 230 330)">
    <rect x="90" y="132" width="270" height="350" rx="12" class="dok"/>
    <path d="M118 178 H260 M118 214 H180 M224 214 H330" class="baris"/>
    <rect x="118" y="246" width="212" height="74" rx="8" fill="#F1F7FC"/>
  </g>
  <g>
    <rect x="124" y="128" width="282" height="388" rx="12" class="dok"/>
    <rect x="150" y="154" width="150" height="16" rx="8" fill="#0A2240"/>
    <path d="M150 204 H270 M150 240 H378" class="baris"/>
    <rect x="146" y="274" width="238" height="48" rx="8" class="sorot"/>
    <path d="M162 298 H366" class="baris" stroke="#2547F4"/>
    <path d="M150 358 H378 M150 394 H378 M260 450 H378" class="baris"/>
  </g>

  <path d="M384 298 C 470 298, 470 230, 540 230" class="hubung"/>

  <!-- Hasil terstruktur -->
  <rect x="540" y="128" width="376" height="388" rx="20" class="panel"/>
  <g font-size="28" font-weight="700">
    <circle cx="590" cy="212" r="22" fill="#0C7C6C"/>
    <path d="M580 212 l7 8 l14 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M630 212 H880" class="baris"/>
    <circle cx="590" cy="322" r="22" fill="#FF6B2C"/>
    <text x="590" y="332" text-anchor="middle">!</text>
    <path d="M630 322 H880" class="baris"/>
    <circle cx="590" cy="432" r="22" fill="#F3D502"/>
    <text x="590" y="432" text-anchor="middle" dy="10">?</text>
    <path d="M630 432 H880" class="baris"/>
  </g>

  <rect x="28" y="26" width="400" height="56" rx="28" fill="#F3D502"/>
  <text x="228" y="63" font-size="29" font-weight="700" text-anchor="middle">Ilustrasi konseptual</text>
</svg>
